[package]
name = "music-link-finder"
version = "1.0.0"
edition = "2024"
build = "build.rs"
description = "YouTube Korean-pronunciation and karaoke link finder"
default-run = "music-link-finder-web"

[features]
default = []
windows-app = []

[[bin]]
name = "music-link-finder"
path = "src/main.rs"
required-features = ["windows-app"]

[[bin]]
name = "music-link-finder-web"
path = "src/bin/web.rs"

[dependencies]
axum = "0.8"
regex = "1.12"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "charset", "query", "rustls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi",
    "Win32_System_DataExchange", "Win32_System_LibraryLoader",
    "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Controls",
    "Win32_Security", "Win32_Security_Cryptography", "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_HiDpi", "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.31"

[package.metadata.winresource]
FileDescription = "음악 한글발음 링크 찾기"
ProductName = "Music Link Finder"
OriginalFilename = "MusicLinkFinder.exe"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
