<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff7fa">
  <meta name="description" content="곡 제목으로 한글 발음 영상과 노래방 반주를 찾고 YouTube 링크를 복사하세요.">
  <title>UtaLink — 음악 링크 찾기</title>
  <link rel="canonical" href="{{PUBLIC_ORIGIN}}/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="UtaLink">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="UtaLink — 한글 발음·노래방 링크 찾기">
  <meta property="og:description" content="곡 제목으로 한글 발음 영상과 노래방 반주를 찾고 YouTube 링크를 복사하세요.">
  <meta property="og:url" content="{{PUBLIC_ORIGIN}}/">
  <meta property="og:image" content="{{PUBLIC_ORIGIN}}{{SHARE_IMAGE_PATH}}">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="핑크 배경의 UtaLink 로고와 한글 발음·노래방 반주 안내">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="UtaLink — 한글 발음·노래방 링크 찾기">
  <meta name="twitter:description" content="곡 제목으로 한글 발음 영상과 노래방 반주를 찾고 YouTube 링크를 복사하세요.">
  <meta name="twitter:image" content="{{PUBLIC_ORIGIN}}{{SHARE_IMAGE_PATH}}">
  <meta name="twitter:image:alt" content="핑크 배경의 UtaLink 로고와 한글 발음·노래방 반주 안내">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=miku">
  <link rel="preload" href="/fonts/pretendard-jp-regular-v1.3.9.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{STYLESHEET_URL}}">
  <script defer src="{{SCRIPT_URL}}"></script>
</head>
<body>
  <a class="skip-link" href="#song-query">검색으로 건너뛰기</a>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="UtaLink 홈"><span>UtaLink<small>YouTube 음악 검색</small></span></a>

    </header>
    <main>
      <section class="search-section" aria-labelledby="search-heading">
        <h1 id="search-heading" class="sr-only">곡 찾기</h1>
        <form id="search-form" novalidate>
          <label for="song-query" class="sr-only">곡 제목이나 별칭</label>
          <div class="search-row"><input id="song-query" name="q" type="search" maxlength="120" placeholder="곡 제목 또는 별칭" autocomplete="off" required aria-describedby="search-help"><button type="submit" id="submit-btn" class="search-button"><span id="button-text">검색</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12h14m-5-5 5 5-5 5"/></svg></button></div>
          <div class="search-options">
            <fieldset class="mode-picker"><legend class="sr-only">영상 유형</legend><div class="mode-grid">
              <label class="mode-option"><input type="radio" name="mode" value="pronunciation" checked><span>한글 발음</span></label>
              <label class="mode-option"><input type="radio" name="mode" value="karaoke"><span>노래방 반주</span></label>
            </div></fieldset>
            <label class="auto-copy-option" for="auto-copy"><input id="auto-copy" type="checkbox" role="switch" aria-describedby="auto-copy-help"><span class="switch-track" aria-hidden="true"></span><span>첫 번째 링크 자동 복사</span></label>
          </div>
          <p id="search-help" class="sr-only">한국어, 일본어, 영어로 검색할 수 있습니다.</p><p id="auto-copy-help" class="sr-only">켜면 검색이 끝났을 때 첫 번째 영상의 링크를 복사합니다.</p>
        </form>
      </section>
      <div class="workspace">
        <section class="results-section" id="results-section" aria-labelledby="results-title">
          <div class="results-header"><h2 id="results-title">검색 결과</h2><span id="result-count" class="result-count" hidden></span></div>
          <div id="status" class="empty-state" role="status" aria-live="polite"></div>
          <div id="results" class="results" hidden></div>
          <div id="fallback" class="fallback" hidden><label for="fallback-url">직접 복사하기</label><p>브라우저에서 복사가 제한되어 있습니다. 주소를 선택해 복사하세요.</p><div class="fallback-row"><input id="fallback-url" type="text" readonly><button id="fallback-select" type="button">전체 선택</button></div></div>
        </section>
        <aside class="selection-panel" aria-label="선택한 영상">
          <div class="preview"><img id="selected-image" alt="" hidden><span id="preview-placeholder">미리보기 없음</span></div>
          <div class="selected-info"><p id="selected-kind" class="selected-kind"></p><h2 id="selected-title">선택한 영상</h2><p id="selected-channel"></p></div>
          <div class="selected-actions"><button id="selected-copy" type="button" class="selected-copy" disabled>링크 복사</button><a id="selected-open" class="selected-open" target="_blank" rel="noopener noreferrer" hidden>YouTube</a></div>
          <p class="desktop-note">VRChat 중계는 Windows 앱에서 사용할 수 있습니다.</p>
        </aside>
      </div>
    </main>
    <footer><span>UtaLink</span><span>YouTube 비공식 검색</span><em class="author-credit">by hanbi.</em></footer>
  </div>
</body>
</html>
